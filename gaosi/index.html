<script>
window.forceUpdate = async function(){
  try{
    var ks = await caches.keys();
    await Promise.all(ks.map(function(k){ return caches.delete(k); }));
    var reg = await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update();
  }catch(e){}
  location.reload();
};
if ('serviceWorker' in navigator) {
  var __hadCtrl = !!navigator.serviceWorker.controller, __refreshing = false;
  navigator.serviceWorker.register('../sw.js');
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!__hadCtrl || __refreshing) return;
    __refreshing = true; location.reload();
  });
  var __reg = null;
  navigator.serviceWorker.ready.then(function(r){ __reg = r; });
  var __u = document.querySelector('[data-upd]');
  if (__u) __u.addEventListener('click', function(){ window.forceUpdate(); });
  setInterval(function(){ if (__reg) __reg.update(); }, 30 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && __reg) __reg.update();
  });
}
</script>
