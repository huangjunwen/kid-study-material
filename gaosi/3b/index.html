<script>
if ('serviceWorker' in navigator) {
  var __hadCtrl = !!navigator.serviceWorker.controller, __refreshing = false;
  navigator.serviceWorker.register('../../sw.js');
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if (!__hadCtrl || __refreshing) return;
    __refreshing = true; location.reload();
  });
  var __reg = null;
  navigator.serviceWorker.ready.then(function(r){ __reg = r; });
  setInterval(function(){ if (__reg) __reg.update(); }, 30 * 60 * 1000);
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && __reg) __reg.update();
  });
}
</script>
