<h1>🍬 例题 6 · 分糖</h1>
<div class="problem card">小明、小红、小玲共有 <b>73</b> 块糖。如果小玲吃掉 <b>3</b> 块，那么小红与小玲的糖就一样多；如果小红给小明 <b>2</b> 块糖，那么小明的糖就是小红的 <b>2 倍</b>。问小红有多少块糖？</div>
<div class="card">
  <div class="groups" id="groups"></div>
  <div class="stepbadge" id="stepbadge"></div>
  <div id="bars"></div>
  <div class="equation" id="eq"></div>
  <div class="answer" id="ans"></div>
  <div class="controls">
    <button id="prev">◀ 上一步</button>
    <div class="dots" id="dots"></div>
    <button id="next">下一步 ▶</button>
  </div>
</div>
<details class="summary card"><summary>💡 思路总结</summary><div>先把两个「如果」翻译成算式：① 玲−3 = 红 → <b>玲 = 红＋3</b>；② 红−2 后 明＋2 = 2×(红−2) → <b>明 = 红×2−6</b>。再代入总数：(红×2−6)＋红＋(红＋3) = 4红−3 = 73 → 红 = <b>19</b>。</div></details>
