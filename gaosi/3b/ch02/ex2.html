<h1>👴 例题 2 · 四人的年龄</h1>
<div class="problem card">四个人的年龄和等于 <b>77</b>，其中年龄最小的是 <b>10</b> 岁，他与年龄最大的人的年龄之和比另外两人的年龄之和<b>大 7</b> 岁。年龄最大的人是多少岁？</div>
<div class="stagewrap">
<div class="sidebtn l"><button id="prev">◀ 上一步</button></div>
<div class="card stage">
  <div class="groups" id="groups"></div>
  <div class="stepbadge" id="stepbadge"></div>
  <div id="bars"></div>

  <div class="answer" id="ans"></div>
  <div class="controls">
    <div class="dots" id="dots"></div>
  </div>
</div>
<div class="sidebtn r"><button id="next">下一步 ▶</button></div>
</div>
<details class="summary card"><summary>💡 思路总结</summary><div>和差问题：A 队（10 岁＋最大）与 B 队（另外两人）的和是 77、差是 7。给 B 队「补上 7」让两队一样长：(77＋7)÷2 = 42 就是 A 队 → 最大 = 42 − 10 = <b>32</b> 岁。口诀：<b>(和＋差) ÷ 2 = 大数</b>。</div></details>
