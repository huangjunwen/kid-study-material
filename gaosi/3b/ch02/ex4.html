<h1>🍎 例题 4 · 四箱苹果</h1>
<div class="problem card">有甲、乙、丙、丁四箱苹果，甲箱苹果数是乙的 <b>2 倍</b>，乙箱苹果数比丙丁两箱和的 <b>3 倍多 4</b> 个，丙箱苹果数是丁的 <b>2 倍</b>。四箱苹果一共 <b>132</b> 个。丁箱有多少个苹果？</div>
<div class="stagewrap">
<div class="sidebtn l"><button id="prev">◀ 上一步</button></div>
<div class="card stage">
  <div class="groups" id="groups"></div>
  <div class="stepbadge" id="stepbadge"></div>
  <div id="bars"></div>
  <div class="equation" id="eq"></div>
  <div class="answer" id="ans"></div>
  <div class="controls">
    <div class="dots" id="dots"></div>
  </div>
</div>
<div class="sidebtn r"><button id="next">下一步 ▶</button></div>
</div>
<details class="summary card"><summary>💡 思路总结</summary><div>四个对象但一环扣一环：从最小的<b>丁</b>出发设为 1 份 → 丙 = 2份 → 丙＋丁 = 3份 → 乙 = 9份＋4 → 甲 = 18份＋8 → 合计 30份＋12 = 132 → 1份 = 4。像剥洋葱一样层层换算就够了。</div></details>
