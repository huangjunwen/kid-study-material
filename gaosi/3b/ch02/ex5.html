<h1>🎫 例题 5 · 积分卡</h1>
<div class="problem card">小高和卡莉娅各有一些积分卡。小高的积分比卡莉娅的 <b>3 倍多 3</b> 分，而卡莉娅的积分比小高的 <b>3 倍少 73</b> 分。请问：两人一共多少分？</div>

  <div class="controls">

  </div>
</div>
</div>
<details class="summary card"><summary>💡 思路总结</summary><div>两个对象<b>互为倍数</b>：先由第一句得「高 = 3卡＋3」，把第二句「卡 = 3高−73」里的高换成 (3卡＋3)，得 3高 = 9卡＋9；又 3高 = 卡＋73，所以 卡＋73 = 9卡＋9 → 卡 = 8，高 = 27，一共 <b>35</b> 分。</div></details>
