<h1>📚 例题 1 · 小华的书</h1>
<div class="problem card">小华所有的数学书、语文书和英语书一共 <b>70</b> 本，其中<b>数学书和语文书</b>的数量之和是<b>英语书</b>的 <b>4 倍</b>，<b>数学书和英语书</b>的数量之和比<b>语文书</b>的 <b>3 倍少 2</b> 本。小华有几本数学书？</div>

<details class="summary card"><summary>💡 思路总结</summary><div>关键第一步：<b>打包</b>！把「数学＋语文」捆成一队 A，英语是 B 队，先用和倍问题求出英语书；再用第二个条件把数学书换成「语文×3−16」，代入「数＋语 = 56」，式子里就只剩语文一个未知数啦。最后别忘了验算。</div></details>
